version: '3.8'

services:
  app-blue:
    build:
      context: .
      dockerfile: Dockerfile.blue
    container_name: app-blue
    environment:
      - PORT=8081
    ports:
      - "8081:8081"
    restart: unless-stopped

  app-green:
    build:
      context: .
      dockerfile: Dockerfile.green
    container_name: app-green
    environment:
      - PORT=8082
    ports:
      - "8082:8082"
    restart: unless-stopped

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-reverse-proxy
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-blue.conf:/etc/nginx/conf.d/upstream.conf:ro
    depends_on:
      - app-blue
      - app-green
    restart: unless-stopped
