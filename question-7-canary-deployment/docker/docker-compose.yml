version: '3.8'

services:
  app-stable:
    build:
      context: .
      dockerfile: Dockerfile.stable
    container_name: app-stable
    environment:
      - PORT=8081
    ports:
      - "8081:8081"
    restart: unless-stopped

  app-canary:
    build:
      context: .
      dockerfile: Dockerfile.canary
    container_name: app-canary
    environment:
      - PORT=8082
      - FAULT_RATE=0.0
    ports:
      - "8082:8082"
    restart: unless-stopped

  nginx-canary-proxy:
    image: nginx:alpine
    container_name: nginx-canary-proxy
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-10pct.conf:/etc/nginx/conf.d/upstream.conf:ro
    depends_on:
      - app-stable
      - app-canary
    restart: unless-stopped
