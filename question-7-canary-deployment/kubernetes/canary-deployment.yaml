# Kubernetes Progressive Canary Deployment Configuration
# Demonstrates Pod-ratio / Traffic weighting between Stable and Canary

apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-stable
  namespace: default
  labels:
    app: canary-demo
    track: stable
spec:
  replicas: 9  # 90% of pod traffic capacity
  selector:
    matchLabels:
      app: canary-demo
      track: stable
  template:
    metadata:
      labels:
        app: canary-demo
        track: stable
    spec:
      containers:
        - name: web
          image: python:3.11-slim
          command: ["python", "-m", "http.server", "8080"]
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-canary
  namespace: default
  labels:
    app: canary-demo
    track: canary
spec:
  replicas: 1  # 10% of pod traffic capacity (Stage 1)
  selector:
    matchLabels:
      app: canary-demo
      track: canary
  template:
    metadata:
      labels:
        app: canary-demo
        track: canary
    spec:
      containers:
        - name: web
          image: python:3.11-slim
          command: ["python", "-m", "http.server", "8080"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: canary-demo-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: canary-demo  # Routes to both stable (9 pods) and canary (1 pod)
  ports:
    - port: 80
      targetPort: 8080
