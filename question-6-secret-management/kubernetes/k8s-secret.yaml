apiVersion: v1
kind: Secret
metadata:
  name: enterprise-app-secrets
  namespace: default
  labels:
    app: enterprise-app
    security.devops.io/tier: restricted
type: Opaque
data:
  # Base64 encoded dummy values (NEVER commit real credentials)
  # echo -n "dummy-secure-db-pass-12345" | base64 -> ZHVtbXktc2VjdXJlLWRiLXBhc3MtMTIzNDU=
  database-password: ZHVtbXktc2VjdXJlLWRiLXBhc3MtMTIzNDU=
  # echo -n "mock-vault-api-key-99999" | base64 -> bW9jay12YXVsdC1hcGkta2V5LTk5OTk5
  api-key: bW9jay12YXVsdC1hcGkta2V5LTk5OTk5
