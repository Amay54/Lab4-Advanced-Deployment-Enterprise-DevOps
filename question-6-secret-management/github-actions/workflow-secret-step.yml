# Sample GitHub Actions Step for Safe Secret Injection
# This demonstrates mapping repository secrets to environment variables
# and ensuring secrets are never exposed in terminal execution logs.

name: Secret Injection Demonstration Job
jobs:
  verify-secret-handling:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Repository Code
        uses: actions/checkout@v4

      - name: Inject and Verify Secrets Safely
        env:
          # Map GitHub Actions Secrets to environment variables
          DB_SECRET: ${{ secrets.DUMMY_DATABASE_PASSWORD || 'dummy-secret-db-pass-12345' }}
          API_TOKEN: ${{ secrets.DUMMY_API_KEY || 'mock-vault-token-xyz-99999' }}
        run: |
          echo "======================================================="
          echo " GITHUB ACTIONS SECRET INJECTION VERIFICATION"
          echo "======================================================="
          
          # 1. Verify existence without printing raw plaintext
          if [ -n "$DB_SECRET" ]; then
            echo "[VERIFIED] DB_SECRET is present in environment."
          fi
          
          if [ -n "$API_TOKEN" ]; then
            echo "[VERIFIED] API_TOKEN is present in environment."
          fi

          # 2. Demonstrate safe masking (Length & character count only)
          DB_LEN=${#DB_SECRET}
          API_LEN=${#API_TOKEN}
          echo "DB_SECRET Length: $DB_LEN characters"
          echo "API_TOKEN Length: $API_LEN characters"
          
          # 3. Masked representation (safe for logs)
          MASKED_DB="${DB_SECRET:0:2}****${DB_SECRET: -2}"
          echo "Safe Masked DB Representation: $MASKED_DB"
          echo "======================================================="
