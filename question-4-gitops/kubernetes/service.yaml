apiVersion: v1
kind: Service
metadata:
  name: enterprise-app-svc
  namespace: default
  labels:
    app: enterprise-app
    app.kubernetes.io/managed-by: argocd
spec:
  type: ClusterIP
  selector:
    app: enterprise-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
